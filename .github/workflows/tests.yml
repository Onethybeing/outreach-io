name: Tests

# The suite talks to Postgres constantly. Run it against a database on the runner itself, not the
# remote Neon one: the round trips are what made a local run take a quarter of an hour.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  # Superseded pull-request runs are worth cancelling; a main run is the one result you want kept,
  # and two merges close together would otherwise leave main with no completed run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outreach_io
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/outreach_io
      APP_MODE: dev
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Generated per run, never committed: a real key in the repo is one copy-paste away from
      # being used somewhere it would matter.
      - name: Generate throwaway bootstrap secrets
        run: |
          python -c "from cryptography.fernet import Fernet; print('VAULT_MASTER_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
          python -c "import secrets; print('SESSION_SECRET=' + secrets.token_urlsafe(32))" >> "$GITHUB_ENV"
      - run: alembic upgrade head
      # Serial on purpose: some fixtures clear shared tables (the vault, for one) and commit, so
      # parallel workers would pull the rows out from under each other.
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --quiet
      - run: npm run build
        env:
          API_ORIGIN: http://localhost:8000
